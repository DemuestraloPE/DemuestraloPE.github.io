name: ci

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc +'%Y%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # 1. Crear directorios necesarios
      - run: |
          mkdir -p docs/clases_zip
          mkdir -p docs/assets/pdf

      # 2. Descomprimir todos los archivos .zip dentro de docs/clases_zip/
      - name: Descomprimir proyectos LaTeX (.zip)
        run: |
          mkdir -p docs/tex_extracted
          for zip in docs/clases_zip/*.zip; do
            if [ -f "$zip" ]; then
              folder_name=$(basename "$zip" .zip)
              unzip -o "$zip" -d "docs/tex_extracted/$folder_name"
            fi
          done

      # 3. Compilar LaTeX a PDF (con búsqueda recursiva correcta)
      - name: Compilar LaTeX a PDF
        uses: xu-cheng/latex-action@v2
        with:
          glob_root_file: true
          root_file: "docs/tex_extracted/**/*.tex"
          args: "-pdf -interaction=nonstopmode -output-directory=docs/assets/pdf"
          continue_on_error: true

      # 4. Instalar dependencias de Python para MkDocs
      - run: pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocs-gen-files

      # 5. Configurar identidad de Git para el bot de despliegue
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 6. Desplegar sitio web en GitHub Pages
      - run: mkdocs gh-deploy --force
