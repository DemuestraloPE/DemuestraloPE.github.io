name: ci

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc +'%Y%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # 1. Crear la carpeta contenedora para PDFs
      - run: mkdir -p docs/assets/pdf

      # 2. Compilar todos los archivos .tex del repositorio directamente con TeX Live Full
      - name: Compilar todos los .tex a PDF
        run: |
          # Buscar archivos .tex dentro de docs/ (excluyendo plantillas auxiliares si es necesario)
          find docs -type f -name "*.tex" | while read -r tex_file; do
            dir_path=$(dirname "$tex_file")
            file_name=$(basename "$tex_file" .tex)
            
            echo "Compilando $tex_file en la carpeta $dir_path..."
            
            # Ejecutar latexmk desde la carpeta donde reside el .tex para que encuentre sus imágenes locales
            docker run --rm -v "$(pwd):/github/workspace" -w "/github/workspace/$dir_path" ghcr.io/xu-cheng/texlive-full:latest \
              latexmk -pdf -interaction=nonstopmode -output-directory=../../assets/pdf "$file_name.tex" || true
          done

      # 3. Verificar qué PDFs se generaron
      - name: Verificar PDFs en assets/pdf/
        run: |
          echo "=== PDFs generados ==="
          ls -la docs/assets/pdf/

      # 4. Instalar dependencias para MkDocs
      - run: pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocs-gen-files

      # 5. Configurar Git Bot
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 6. Desplegar sitio web
      - run: mkdocs gh-deploy --force
      
      # 7. Guardar copia de respaldo de la web compilada y los PDFs como Artefacto
      - name: Crear Respaldo de Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-sitio-y-pdfs
          path: site/
          retention-days: 30
