name: ci

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc +'%Y%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # 1. Crear estructuras de carpetas requeridas
      - run: |
          mkdir -p docs/clases_zip
          mkdir -p docs/assets/pdf
          mkdir -p docs/tex_extracted

      # 2. Descomprimir los archivos .zip
      - name: Descomprimir proyectos LaTeX (.zip)
        run: |
          for zip in docs/clases_zip/*.zip; do
            if [ -f "$zip" ]; then
              folder_name=$(basename "$zip" .zip)
              unzip -o "$zip" -d "docs/tex_extracted/$folder_name"
            fi
          done

      # 3. Compilación robusta a PDF (Busca el .tex principal de cada ZIP)
      - name: Compilar LaTeX a PDF de forma dinámica
        uses: xu-cheng/latex-action@v2
        with:
          glob_root_file: true
          root_file: "docs/tex_extracted/**/*.tex"
          args: "-pdf -interaction=nonstopmode -output-directory=docs/assets/pdf"
          continue_on_error: true

      # Mover los PDFs generados en subcarpetas a la raíz de assets/pdf
      - name: Normalizar ubicación de PDFs
        run: |
          find docs/assets/pdf/ -name "*.pdf" -exec mv {} docs/assets/pdf/ \;

      # 4. Instalar dependencias para la web
      - run: pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocs-gen-files

      # 5. Configurar Git Bot
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 6. Desplegar sitio en GitHub Pages
      - run: mkdocs gh-deploy --force
