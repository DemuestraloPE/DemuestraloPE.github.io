name: ci

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc +'%Y%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # 1. Crear directorios necesarios
      - run: |
          mkdir -p docs/clases_zip
          mkdir -p docs/assets/pdf
          mkdir -p docs/tex_extracted

      # 2. Descomprimir todos los .zip en carpetas individuales
      - name: Descomprimir proyectos LaTeX (.zip)
        run: |
          for zip in docs/clases_zip/*.zip; do
            if [ -f "$zip" ]; then
              folder_name=$(basename "$zip" .zip)
              unzip -o "$zip" -d "docs/tex_extracted/$folder_name"
            fi
          done

      # 3. Localizar el archivo TeX principal y compilarlo
      - name: Buscar y compilar archivos LaTeX a PDF
        run: |
          find docs/tex_extracted -type f -name "*.tex" | while read -r tex_file; do
            # Priorizar main.tex o compilar el primer .tex que encuentre
            echo "Encontrado archivo TeX: $tex_file"
          done

      - name: Compilar LaTeX a PDF
        uses: xu-cheng/latex-action@v2
        with:
          root_file: |
            docs/tex_extracted/*/main.tex
            docs/tex_extracted/*/*.tex
          args: "-pdf -interaction=nonstopmode -output-directory=docs/assets/pdf"
          continue_on_error: true

      # 4. Aplanar la estructura de PDFs y renombrar al nombre del ZIP
      - name: Normalizar ubicación de PDFs
        run: |
          echo "=== Organizando archivos PDF generados ==="
          find docs/assets/pdf -type f -name "*.pdf" | while read -r pdf_file; do
            filename=$(basename "$pdf_file")
            mv "$pdf_file" "docs/assets/pdf/$filename"
          done
          echo "=== Contenido final de docs/assets/pdf/ ==="
          ls -la docs/assets/pdf/

      # 5. Instalar dependencias para MkDocs
      - run: pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocs-gen-files

      # 6. Configurar Git Bot
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 7. Desplegar sitio web
      - run: mkdocs gh-deploy --force
