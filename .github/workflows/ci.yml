name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc +'%Y%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Instalar LaTeXML
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes latexml

      - name: Convertir clases LaTeX enlazadas desde Markdown
        run: python scripts/build_latex_pages.py

      - name: Instalar dependencias de MkDocs
        run: pip install mkdocs-material

      - name: Validar el sitio
        run: mkdocs build

      - name: Guardar el sitio compilado
        uses: actions/upload-artifact@v4
        with:
          name: sitio-compilado
          path: site/
          retention-days: 30

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Descargar el sitio compilado
        uses: actions/download-artifact@v4
        with:
          name: sitio-compilado
          path: site/

      - name: Instalar ghp-import
        run: pip install ghp-import

      - name: Configurar Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publicar GitHub Pages
        run: ghp-import --nojekyll --push --force --branch gh-pages site
