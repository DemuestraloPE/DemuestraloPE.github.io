<!-- Tabla de contenidos nativa -->
{% if page and page.toc %}
  <nav class="md-nav md-nav--secondary" aria-label="{{ lang.t('toc') }}">
    <label class="md-nav__title" for="__toc">
      <span class="md-nav__icon md-icon"></span>
      {{ lang.t('toc') }}
    </label>
    <ul class="md-nav__list" data-md-component="toc" data-md-scrollfix>
      {% for toc_item in page.toc %}
        <li class="md-nav__item">
          <a href="{{ toc_item.url }}" class="md-nav__link">
            <span class="md-ellipsis">{{ toc_item.title }}</span>
          </a>
          {% if toc_item.children %}
            <nav class="md-nav" aria-label="{{ toc_item.title }}">
              <ul class="md-nav__list">
                {% for child in toc_item.children %}
                  <li class="md-nav__item">
                    <a href="{{ child.url }}" class="md-nav__link">
                      <span class="md-ellipsis">{{ child.title }}</span>
                    </a>
                  </li>
                {% endfor %}
              </ul>
            </nav>
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  </nav>
{% endif %}

<!-- Bloque dinámico para citas aleatorias -->
<div class="sidebar-random-fact-section" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--md-default-fg-color--lightest);">
  <div class="sidebar-random-fact"></div>
</div>
