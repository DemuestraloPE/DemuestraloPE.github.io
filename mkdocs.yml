site_name: DemuestraloPE
site_description: Un catálogo colaborativo de teoremas de física explicados en tres niveles de rigor científico.
site_author: Comunidad DemuestraloPE

theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/images/LOGODEMUESTRALO.PNG
  favicon: assets/images/LOGODEMUESTRALO.PNG
  palette:
    - scheme: slate
      primary: deep purple
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - scheme: default
      primary: deep purple
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
  features:
    - navigation.tabs           # Pestañas superiores (Inicio, Matemáticas, Física)
    - navigation.tabs.sticky    # Mantiene las pestañas visibles al hacer scroll
    - navigation.sections       # Agrupa secciones en el menú lateral
    - navigation.indexes        # Permite abrir el índice de cada sección desde su título
    - navigation.path           # Muestra ruta de migas de pan (breadcrumbs)
    - navigation.top            # Botón para volver arriba
    - search.suggest            # Buscador con sugerencias inteligentes
    - content.tabs.link         # Pestañas en las demostraciones

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - admonition
  - pymdownx.details            # Cajas desplegables
  - pymdownx.emoji:             # Emoticonos y badges
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:          # Listas de tareas
      custom_checkbox: true
  - pymdownx.highlight:         # Resaltado de código
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys               # Teclas (++ctrl+alt+del++)

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js
  - javascripts/random_quotes.js
  - javascripts/draggable_panels.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/generate_indexes.py
  - awesome-pages

# Evita que la falta de un PDF detenga el despliegue
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
