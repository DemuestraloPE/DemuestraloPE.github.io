site_name: DemuestraloPE
site_description: Un catálogo colaborativo de teoremas de física explicados en tres niveles de rigor científico.
site_author: Comunidad DemuestraloPE

theme:
  name: material
  custom_dir: overrides  # <-- Habilita las plantillas personalizadas
  language: es
  logo: assets/images/LOGODEMUESTRALO.PNG
  favicon: assets/images/LOGODEMUESTRALO.PNG
  palette:
    - scheme: slate
      primary: deep purple
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - scheme: default
      primary: deep purple
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
  features:
    - navigation.tabs           # Pestañas superiores (Inicio, Matemáticas, Física)
    - navigation.sections       # Agrupa secciones en el menú lateral
    - navigation.expand         # Mantiene las subcarpetas abiertas automáticamente
    - navigation.top            # Botón para volver arriba
    - search.suggest            # Buscador con sugerencias inteligentes
    - content.tabs.link         # Pestañas en las demostraciones

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - admonition
  - pymdownx.details            # Cajas desplegables (collapsible/acordeón)
  - pymdownx.emoji:             # Soporte completo de emoticonos y GitHub Badges
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:          # Listas de tareas interactiva [-] o [x]
      custom_checkbox: true
  - pymdownx.highlight:         # Resaltado sintáctico avanzado de código TeX, Python, C++
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys               # Formato para teclas de teclado: ++ctrl+alt+del++

# 📌 AQUÍ SE AGREGÓ EL SCRIPT DE CITAS/DATOS ALEATORIOS:
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js
  - javascripts/random_quotes.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - awesome-pages
  - gen-files:
      scripts:
        - scripts/generate_indexes.py

# Menú principal simplificado:
nav:
  - Inicio: index.md
  - Plantilla Colaborativa: PlantillaPE.md
  - Matemáticas: matematica/index.md
  - Física: fisica/index.md
